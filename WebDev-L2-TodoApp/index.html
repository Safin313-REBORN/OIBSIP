<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro — Daily Planner & Interactive To-Do Web App</title>
  <meta name="description" content="Manage daily tasks with pending and completed lists, inline editing, priority filters, timestamps, and persistent localStorage.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Background Glows -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="container header-wrap">
      <div class="brand">
        <span class="brand-logo">⚡</span>
        <div>
          <h1 class="brand-title">TaskFlow <span class="badge">PRO</span></h1>
          <p class="brand-sub">Daily Planner & Productivity Suite</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-sm btn-outline" id="clearAllCompletedBtn">Clear Completed</button>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <!-- Productivity Summary Card -->
    <section class="summary-card">
      <div class="summary-top">
        <div>
          <h2 class="summary-greeting" id="greetingText">Good Day! Let's get things done.</h2>
          <p class="summary-stats-sub" id="summarySub">You have 0 tasks pending today.</p>
        </div>
        <div class="progress-circle-wrap">
          <div class="progress-percentage" id="progressPercentage">0%</div>
          <span class="progress-label">Completed</span>
        </div>
      </div>
      <!-- Progress Bar -->
      <div class="progress-track">
        <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
      </div>
    </section>

    <!-- Task Creation Form Card -->
    <section class="task-form-card">
      <form class="task-form" id="taskForm">
        <div class="input-row-main">
          <input type="text" id="taskTitleInput" placeholder="What needs to be accomplished today?" required autocomplete="off" aria-label="Task title">
          <button type="submit" class="btn btn-primary" id="addTaskBtn">
            <span>Add Task</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>

        <div class="options-row">
          <!-- Priority Selector -->
          <div class="option-group">
            <label for="prioritySelect">Priority:</label>
            <select id="prioritySelect">
              <option value="high">🔴 High Priority</option>
              <option value="medium" selected>🟡 Medium Priority</option>
              <option value="low">🟢 Low Priority</option>
            </select>
          </div>

          <!-- Category Selector -->
          <div class="option-group">
            <label for="categorySelect">Category:</label>
            <select id="categorySelect">
              <option value="work">💼 Work</option>
              <option value="study">📚 Study</option>
              <option value="personal">🏠 Personal</option>
              <option value="health">💪 Health</option>
            </select>
          </div>

          <!-- Optional Due Date -->
          <div class="option-group">
            <label for="dueDateInput">Due Date:</label>
            <input type="date" id="dueDateInput">
          </div>
        </div>
      </form>
    </section>

    <!-- Search & Filter Controls -->
    <div class="controls-bar">
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search tasks by keyword...">
      </div>

      <div class="filter-pills" role="tablist">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="filter-btn" data-filter="high">High Priority</button>
      </div>
    </div>

    <!-- Dual Task Lists Grid -->
    <div class="lists-grid">
      <!-- Pending Tasks Column -->
      <section class="task-column">
        <div class="column-header">
          <div class="col-title-wrap">
            <span class="col-dot pending-dot"></span>
            <h3>Pending Tasks</h3>
          </div>
          <span class="count-pill" id="pendingCountPill">0 pending</span>
        </div>

        <div class="task-list" id="pendingList">
          <!-- Dynamically Rendered -->
        </div>
      </section>

      <!-- Completed Tasks Column -->
      <section class="task-column">
        <div class="column-header">
          <div class="col-title-wrap">
            <span class="col-dot completed-dot"></span>
            <h3>Completed Tasks</h3>
          </div>
          <span class="count-pill" id="completedCountPill">0 completed</span>
        </div>

        <div class="task-list" id="completedList">
          <!-- Dynamically Rendered -->
        </div>
      </section>
    </div>
  </main>

  <footer class="app-footer">
    <div class="container footer-content">
      <span>TaskFlow Pro · Oasis Infobyte SIP (Level 2 Task 3)</span>
      <span>Engineered with HTML5, CSS3, Vanilla JS & LocalStorage</span>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="script.js"></script>
</body>
</html>
